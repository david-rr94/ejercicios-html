<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9.3 - Tablas complejas</title>
    <meta name="description" content="Ejercicios de tablas con rowspan.">
</head>
<body>
    <header>
        <h1>Ejercicio 9.3 - Tabla rowspan</h1>
        <p><a href="index.html">👈 Volver atrás</a></p>
        <hr>
    </header>

    <main>
        <table border="1">
            <thead>
                <tr>
                    <th>Empresas</th>
                    <th>Departamento</th>
                    <th>Presupuesto</th>
                </tr>
            </thead>
            <tbody> 
                <tr>
                    <th rowspan="2"> Empresa A</th>
                    <td>Marketing</td>
                    <td>10.000</td>
                </tr>
                <tr>
                    <td>Ventas</td>
                    <td>15.000</td>
                </tr>
                <tr>
                    <th rowspan="2"> Empresa B</th>
                    <td>Marketing</td>
                    <td>8.000</td>
                </tr>
                <tr>
                    <td>Ventas</td>
                    <td>12.000</td>
                </tr>
            </tbody>
            
        </table>
        
    </main>
</body>

</html>
