<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10.1 - Formulario de contacto simple</title>
    <meta name="description" content="Ejercicio de  formulario de contacto simple">
</head>
<body>
    <header>
        <h1>Ejercicio 10.1 - Formulario de contacto simple</h1>
        <p><a href="index.html">👈 Volver atrás</a></p>
        <hr>
    </header>
    <main>
        <form action="#" method="get">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe su nombre">
            <p></p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Escribe su email">
            <p></p>
            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje" rows="5"></textarea>
            <button type="submit">Enviar</button>
        </form>
    </main>
</body>

</html>
